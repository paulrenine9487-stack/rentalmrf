# Caddy 2 Production Configuration for MCC MRF Innovation Park
# Automatically provisions Let's Encrypt TLS with SSL Labs A+ rating

portal.mccmrfip.com {
    # TLS Configuration with modern cipher suites & HSTS
    tls {
        protocols tls1.2 tls1.3
        ciphers TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256 TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256 TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384 TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384 TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256 TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
    }

    # Security Headers
    header {
        Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
        X-Content-Type-Options "nosniff"
        X-Frame-Options "SAMEORIGIN"
        Referrer-Policy "strict-origin-when-cross-origin"
        Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self 'https://secure.payu.in' 'https://test.payu.in')"
        Cross-Origin-Opener-Policy "same-origin-allow-popups"
        Cross-Origin-Resource-Policy "same-origin"
        -Server
    }

    # Gzip & Zstandard compression
    encode gzip zstd

    # Root for static frontend files
    root * /var/www/rentalmrf/dist

    # Reverse proxy API requests to Node backend
    handle /api/* {
        reverse_proxy localhost:5000 {
            header_up Host {host}
            header_up X-Real-IP {remote_host}
            header_up X-Forwarded-For {remote_host}
            header_up X-Forwarded-Proto {scheme}
        }
    }

    # Static assets immutable caching
    @static {
        path /assets/*
    }
    header @static Cache-Control "public, max-age=31536000, immutable"

    # Single Page App routing
    try_files {path} /index.html
    file_server
}
