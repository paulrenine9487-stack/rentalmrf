# ==============================================================================
# MCC MRF INNOVATION PARK - PRODUCTION NGINX REVERSE PROXY CONFIGURATION
# Optimized for SSL Labs A+ Grade & SecurityHeaders.com A+ Grade
# ==============================================================================

# Rate Limiting Zone: 30 requests/second per IP address
limit_req_zone $binary_remote_addr zone=portal_limit:10m rate=30r/s;

# Upstream Node.js Backend Server
upstream nodejs_backend {
    server 127.0.0.1:5000;
    keepalive 64;
}

# HTTP to HTTPS Automatic Redirect (301 Permanent)
server {
    listen 80;
    listen [::]:80;
    server_name portal.mccmrfip.com;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Primary Production Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name portal.mccmrfip.com;

    # SSL Certificates (e.g. Let's Encrypt / Custom Enterprise CA)
    ssl_certificate /etc/letsencrypt/live/portal.mccmrfip.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.mccmrfip.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/portal.mccmrfip.com/chain.pem;

    # --------------------------------------------------------------------------
    # SSL LABS A+ GRADE TLS PROTOCOLS & MODERN CIPHERS
    # --------------------------------------------------------------------------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    # Diffie-Hellman Parameter for 2048/4096-bit PFS
    # ssl_dhparam /etc/nginx/dhparam.pem;

    # SSL Session Caching & Resumption (High Speed TTFB)
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling (Mandatory for SSL Labs A+ rating)
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # --------------------------------------------------------------------------
    # SECURITY HEADERS (SecurityHeaders.com A+ Rating)
    # --------------------------------------------------------------------------
    # HSTS with 1-Year Max Age, Subdomains, and Preload submission capability
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Content-Security-Policy (Allow PayU, Google Fonts, Sentry, PostHog)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://us-assets.i.posthog.com https://browser.sentry-cdn.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.payu.in https://secure.payu.in https://test.payu.in https://api.pwnedpasswords.com https://*.sentry.io https://*.posthog.com https://www.virustotal.com; frame-src 'self' https://secure.payu.in https://test.payu.in; object-src 'none'; base-uri 'self';" always;

    # Clickjacking, Sniffing & Referrer Protection
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self 'https://secure.payu.in' 'https://test.payu.in')" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Remove server banner
    server_tokens off;

    # --------------------------------------------------------------------------
    # PERFORMANCE OPTIMIZATIONS (PageSpeed, GTmetrix, Lighthouse, WebPageTest)
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    root /var/www/rentalmrf/dist;
    index index.html;

    # Static Assets with Immutable 1-Year Cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Pingdom / Uptime Health Check Probe (Unthrottled)
    location /api/health {
        proxy_pass http://nodejs_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
    }

    # API Proxy with Rate Limiting
    location /api/ {
        limit_req zone=portal_limit burst=20 nodelay;
        proxy_pass http://nodejs_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Single Page Application HTML Fallback (Never cache index.html)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }
}
